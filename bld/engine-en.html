<script id="eng">// ===== FABRUM Structural Design Engine — plate bending FEM (ACM rectangular element) =====
// Units: kN, m. DOF per node: w (down +), wx=dw/dx, wy=dw/dy. Moments per unit width, sagging +.
const SDE = {};
(function (S) {
  const EXP = [[0,0],[1,0],[0,1],[2,0],[1,1],[0,2],[3,0],[2,1],[1,2],[0,3],[3,1],[1,3]];
  const pw = (x, n) => n <= 0 ? (n === 0 ? 1 : 0) : Math.pow(x, n);
  const P = (x, y) => EXP.map(([m, n]) => pw(x, m) * pw(y, n));
  const Px = (x, y) => EXP.map(([m, n]) => m ? m * pw(x, m - 1) * pw(y, n) : 0);
  const Py = (x, y) => EXP.map(([m, n]) => n ? n * pw(x, m) * pw(y, n - 1) : 0);
  const Pxx = (x, y) => EXP.map(([m, n]) => m > 1 ? m * (m - 1) * pw(x, m - 2) * pw(y, n) : 0);
  const Pyy = (x, y) => EXP.map(([m, n]) => n > 1 ? n * (n - 1) * pw(x, m) * pw(y, n - 2) : 0);
  const Pxy = (x, y) => EXP.map(([m, n]) => (m && n) ? m * n * pw(x, m - 1) * pw(y, n - 1) : 0);

  function inv(M) { // Gauss-Jordan with partial pivoting
    const n = M.length, A = M.map((r, i) => r.concat(Array.from({ length: n }, (_, j) => i === j ? 1 : 0)));
    for (let c = 0; c < n; c++) {
      let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      if (Math.abs(A[p][c]) < 1e-14) throw new Error('singular element');
      [A[c], A[p]] = [A[p], A[c]]; const d = A[c][c]; for (let j = 0; j < 2 * n; j++) A[c][j] /= d;
      for (let r = 0; r < n; r++) if (r !== c) { const f = A[r][c]; if (f) for (let j = 0; j < 2 * n; j++) A[r][j] -= f * A[c][j]; }
    }
    return A.map(r => r.slice(n));
  }
  const GP = [[-0.8611363115940526, 0.3478548451374538], [-0.3399810435848563, 0.6521451548625461], [0.3399810435848563, 0.6521451548625461], [0.8611363115940526, 0.3478548451374538]];

  // element matrices for a rectangle a x b, flexural rigidity D, Poisson nu
  function element(a, b, D, nu) {
    const nodes = [[0, 0], [a, 0], [a, b], [0, b]]; const C = [];
    nodes.forEach(([x, y]) => { C.push(P(x, y), Px(x, y), Py(x, y)); });
    const A = inv(C);
    const mulRow = v => { const o = new Array(12).fill(0); for (let j = 0; j < 12; j++) { const vj = v[j]; if (vj) for (let k = 0; k < 12; k++) o[k] += vj * A[j][k]; } return o; };
    const Bat = (x, y) => [mulRow(Pxx(x, y).map(v => -v)), mulRow(Pyy(x, y).map(v => -v)), mulRow(Pxy(x, y).map(v => -2 * v))];
    const Dm = [[D, D * nu, 0], [D * nu, D, 0], [0, 0, D * (1 - nu) / 2]];
    const K = Array.from({ length: 12 }, () => new Array(12).fill(0)), Ms = Array.from({ length: 12 }, () => new Array(12).fill(0)), f = new Array(12).fill(0);
    for (const [gx, wx] of GP) for (const [gy, wy] of GP) {
      const x = a * (gx + 1) / 2, y = b * (gy + 1) / 2, w = wx * wy * a * b / 4, B = Bat(x, y), N = mulRow(P(x, y));
      for (let i = 0; i < 12; i++) {
        f[i] += w * N[i]; for (let j = 0; j < 12; j++) Ms[i][j] += w * N[i] * N[j];
        const d0 = Dm[0][0] * B[0][i] + Dm[0][1] * B[1][i], d1 = Dm[1][0] * B[0][i] + Dm[1][1] * B[1][i], d2 = Dm[2][2] * B[2][i];
        for (let j = 0; j < 12; j++) K[i][j] += w * (d0 * B[0][j] + d1 * B[1][j] + d2 * B[2][j]);
      }
    }
    // moment recovery matrices at the 4 corners: M = Dm * B(corner) * u
    const MB = nodes.map(([x, y]) => { const B = Bat(x, y); return [0, 1, 2].map(r => B[0].map((_, j) => Dm[r][0] * B[0][j] + Dm[r][1] * B[1][j] + Dm[r][2] * B[2][j])); });
    return { K, f, MB, Ms };
  }
  S.element = element;

  // DOF per node: w, fx, fy where fx, fy are the section rotations (fx -> dw/dx, fy -> dw/dy in the thin limit).
  function elementThick(a, b, E, h, nu) {
    const D = E * h * h * h / (12 * (1 - nu * nu)), Gk = (5 / 6) * E / (2 * (1 + nu)) * h, XI = [-1, 1, 1, -1], ET = [-1, -1, 1, 1], g = 1 / Math.sqrt(3);
    const N = (xi, et) => XI.map((x, i) => 0.25 * (1 + xi * x) * (1 + et * ET[i])), Nx = (xi, et) => XI.map((x, i) => 0.5 / a * x * (1 + et * ET[i])), Ny = (xi, et) => XI.map((x, i) => 0.5 / b * ET[i] * (1 + xi * x));
    const Bb = (xi, et) => { const nx = Nx(xi, et), ny = Ny(xi, et), B = [new Array(12).fill(0), new Array(12).fill(0), new Array(12).fill(0)]; for (let i = 0; i < 4; i++) { B[0][3 * i + 1] = -nx[i]; B[1][3 * i + 2] = -ny[i]; B[2][3 * i + 1] = -ny[i]; B[2][3 * i + 2] = -nx[i]; } return B; };
    const gx = (xi, et) => { const n = N(xi, et), nx = Nx(xi, et), r = new Array(12).fill(0); for (let i = 0; i < 4; i++) { r[3 * i] = nx[i]; r[3 * i + 1] = -n[i]; } return r; };
    const gy = (xi, et) => { const n = N(xi, et), ny = Ny(xi, et), r = new Array(12).fill(0); for (let i = 0; i < 4; i++) { r[3 * i] = ny[i]; r[3 * i + 2] = -n[i]; } return r; };
    const gA = gx(0, -1), gC = gx(0, 1), gD = gy(-1, 0), gB = gy(1, 0);
    const Bs = (xi, et) => [gA.map((v, k) => 0.5 * (1 - et) * v + 0.5 * (1 + et) * gC[k]), gD.map((v, k) => 0.5 * (1 - xi) * v + 0.5 * (1 + xi) * gB[k])];
    const Dm = [[D, D * nu, 0], [D * nu, D, 0], [0, 0, D * (1 - nu) / 2]];
    const K = Array.from({ length: 12 }, () => new Array(12).fill(0)), Ms = Array.from({ length: 12 }, () => new Array(12).fill(0)), f = new Array(12).fill(0), gpM = [];

    $('#print').onclick = () => { $('#printarea').innerHTML = `<div class="ph"><b>FABRUM</b> — Structural design calculations</div><div id="rep">${report(ST.res)}</div><div class="pb"><h2>Shop drawings</h2>${ST.sheets.map(sh => `<figure class="sheet"><figcaption>${esc(sh.name)} <small dir="ltr">${esc(sh.en)}</small></figcaption>${sh.svg()}</figure>`).join('')}</div><div class="pb"><h2>Bar schedule</h2>${bbsHTML(ST.res)}</div>`; window.print(); };
