name: keepalive
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site and database
        run: |
          s=$(curl -sS -o /dev/null -w '%{http_code}' https://fabrum.fabrum.workers.dev/)
          d=$(curl -sS -o /tmp/db.txt -w '%{http_code}' -H 'apikey: sb_publishable_IJRPqju-kaooUzO59UlolA_apR5JVIK' 'https://tetrxntlejwjjtasycgh.supabase.co/rest/v1/projects?select=id&limit=1')
          echo "site=$s db=$d"; head -c 300 /tmp/db.txt; echo
          [ "$s" = "200" ] && [ "$d" -ge 200 ] && [ "$d" -lt 500 ]
